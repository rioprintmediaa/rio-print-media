<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renu Contacts — Rio</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; min-height: 100vh;
    background: #f5f0fa; font-family: 'Nunito', sans-serif;
  }
  header { display: none; }
  .page-wrap { max-width: 1100px; margin: 20px auto; padding: 0 20px 40px; }
  .section-header {
    background: linear-gradient(135deg,#7b1fa2,#ab47bc);
    padding: 14px 20px; border-radius: 12px 12px 0 0;
  }
  .section-title { font-family: 'Exo 2',sans-serif; font-weight: 800; font-size: 0.9rem; color: white; display: block; }
  .section-subtitle { font-family: 'Nunito',sans-serif; font-size: 0.72rem; color: rgba(255,255,255,0.85); display: block; margin-top: 2px; }
  .section-body {
    background: white; border-radius: 0 0 12px 12px; padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 280px; }
  .search-wrap svg { position: absolute; left: 9px; top: 9px; opacity: .4; }
  #search { width: 100%; height: 34px; padding: 0 10px 0 30px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 0.82rem; outline: none; font-family: 'Nunito',sans-serif; }
  .btn { height: 34px; padding: 0 16px; border: none; border-radius: 8px; font-family: 'Exo 2',sans-serif; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: #7b1fa2; color: white; }
  .btn-secondary { background: white; color: #7b1fa2; border: 1.5px solid #7b1fa2; }
  #count { margin-left: auto; font-size: 0.75rem; color: #888; font-family: 'Exo 2',sans-serif; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
  thead th { background: #f3e5f5; padding: 10px 12px; text-align: left; font-family: 'Exo 2',sans-serif; font-size: 0.65rem; font-weight: 800; color: #4a148c; text-transform: uppercase; letter-spacing: 0.4px; }
  tbody td { padding: 10px 12px; border-bottom: 1px solid #eef0f5; font-size: 0.82rem; color: #1a1a2e; vertical-align: middle; }
  .paid-yes { padding: 2px 10px; border-radius: 10px; background: #e8f5e9; color: #2e7d32; font-size: 0.68rem; font-weight: 700; }
  .paid-no { padding: 2px 10px; border-radius: 10px; background: #ffebee; color: #c62828; font-size: 0.68rem; font-weight: 700; }
  .actions { display: flex; gap: 5px; }
  .icon-btn { width: 30px; height: 30px; border: none; border-radius: 7px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 14px; align-items: center; }
  .pagination button { height: 28px; padding: 0 12px; border: 1.5px solid #ddd; border-radius: 6px; background: white; cursor: pointer; font-family: 'Exo 2',sans-serif; font-size: 0.7rem; }
  .pagination span { font-size: 0.75rem; color: #666; padding: 0 8px; }
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; align-items: center; justify-content: center; padding: 16px; }
  .modal-box { background: #1c2333; border-radius: 12px; width: 100%; max-width: 440px; overflow: hidden; font-family: 'Exo 2',sans-serif; }
  .modal-head { background: #141922; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a3348; }
  .modal-head span { color: #4dd9e0; font-size: 0.88rem; font-weight: 700; }
  .modal-head .x { color: #aaa; cursor: pointer; font-size: 1.1rem; }
  .modal-body { padding: 20px 24px 10px; display: grid; gap: 14px; }
  .modal-body label { font-size: 0.65rem; font-weight: 700; color: #7a8aa0; text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 5px; }
  .modal-body input, .modal-body select { width: 100%; height: 36px; border: 1.5px solid #2a3348; border-radius: 8px; padding: 0 12px; font-size: 0.85rem; font-family: 'Nunito',sans-serif; outline: none; background: #141922; color: #ddeeff; }
  .modal-foot { padding: 16px 20px 20px; display: flex; gap: 12px; }
  .save-btn { background: #4dd9e0; color: #0d1520; border: none; border-radius: 6px; padding: 10px 32px; font-family: 'Exo 2',sans-serif; font-weight: 800; font-size: 0.82rem; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; }
  .cancel-btn { background: #1e2d40; color: #8ab4cc; border: none; border-radius: 6px; padding: 10px 24px; font-family: 'Exo 2',sans-serif; font-weight: 700; font-size: 0.82rem; cursor: pointer; text-transform: uppercase; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: white; padding: 10px 20px; border-radius: 8px; font-size: 0.82rem; z-index: 1000; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  /* Background logo watermark — replace WATERMARK_LOGO_BASE64 below once
     the actual logo image is available; safe to leave empty for now,
     the page works normally either way since this sits behind everything
     and doesn't intercept clicks. */
  .bg-watermark {
    position: fixed;
    inset: 0;
    z-index: -1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .bg-watermark img {
    max-width: 45%;
    max-height: 45%;
    opacity: 0.10;
  }
  @media (max-width: 700px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tbody tr { background: white; border-radius: 10px; margin-bottom: 10px; padding: 10px 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
    tbody td { border: none; padding: 4px 0; }
    tbody td::before { content: attr(data-label); font-weight: 800; font-size: 0.62rem; color: #888; text-transform: uppercase; display: block; }
    .actions { margin-top: 6px; }
  }
</style>
</head>
<body>

<div class="bg-watermark">
  <img src="data:image/png;base64,WATERMARK_LOGO_BASE64" alt="">
</div>


<div class="page-wrap">
  <div class="section-header">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:32px;height:32px;background:rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg viewBox="0 0 24 24" fill="white" width="18" height="18"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      </div>
      <div>
        <span class="section-title">Renu Contacts</span>
        <span class="section-subtitle">Standalone contact list — separate from the main Contacts tab</span>
      </div>
    </div>
  </div>
  <div class="section-body">
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="text" placeholder="Search name, phone, place...">
    </div>
    <button class="btn btn-secondary" onclick="loadContacts(1)">↻ Refresh</button>
    <button class="btn btn-primary" onclick="openEdit(null)">+ Add Contact</button>
    <span id="count"></span>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Place</th>
        <th>Details</th>
        <th>Date</th>
        <th>Amount Paid</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="7" style="text-align:center;padding:30px;color:#aaa;">Loading…</td></tr>
    </tbody>
  </table>

  <div class="pagination" id="pagination"></div>
  </div>
  </div>

<div id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modal-title">Add Contact</span>
      <span class="x" onclick="document.getElementById('modal').style.display='none'">✕</span>
    </div>
    <input type="hidden" id="f-id">
    <div class="modal-body">
      <div><label>Name *</label><input id="f-name" type="text" placeholder="Full name"></div>
      <div><label>Phone *</label><input id="f-phone" type="tel" placeholder="+91 XXXXX XXXXX"></div>
      <div><label>Place</label><input id="f-place" type="text" placeholder="City or town"></div>
      <div><label>Details</label><input id="f-details" type="text" placeholder="Notes, description..."></div>
      <div><label>Date</label><input id="f-date" type="date"></div>
      <div>
        <label>Amount Paid</label>
        <select id="f-paid">
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="save-btn" onclick="saveContact()">Save</button>
      <button class="cancel-btn" onclick="document.getElementById('modal').style.display='none'">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('token') || '';
let currentPage = 1;

function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  const res = await fetch(path, opts);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || body.detail || ('HTTP ' + res.status));
  }
  return res.json();
}

async function loadContacts(page) {
  if (page) currentPage = page;
  const search = document.getElementById('search').value || '';
  const tbody = document.getElementById('tbody');
  const pgDiv = document.getElementById('pagination');
  const cntEl = document.getElementById('count');
  tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:#aaa;">Loading…</td></tr>';
  try {
    let url = '/api/renu-contacts?page=' + currentPage + '&limit=50';
    if (search) url += '&search=' + encodeURIComponent(search);
    const res = await api(url);
    const rows = res.rows || [];
    const total = res.total || 0;
    const totalPages = Math.ceil(total / 50) || 1;
    cntEl.textContent = total + ' contact' + (total !== 1 ? 's' : '');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#aaa;">No contacts found. Click + Add Contact.</td></tr>';
      pgDiv.innerHTML = '';
      return;
    }
    tbody.innerHTML = rows.map(r => {
      const phone = (r.Phone || '').replace(/\s/g, '');
      const name = escHtml(r.Name || '');
      const paid = (r.AmountPaid === 'Yes');
      return `<tr>
        <td data-label="Name" style="font-weight:700;">${name}</td>
        <td data-label="Phone" style="font-weight:600;color:#7b1fa2;">${escHtml(r.Phone || '—')}</td>
        <td data-label="Place">${escHtml(r.Place || '—')}</td>
        <td data-label="Details" style="color:#666;">${escHtml(r.Details || '—')}</td>
        <td data-label="Date">${escHtml(r.Date || '—')}</td>
        <td data-label="Amount Paid"><span class="${paid ? 'paid-yes' : 'paid-no'}">${paid ? 'Yes' : 'No'}</span></td>
        <td data-label="Actions"><div class="actions">
          <button class="icon-btn" style="background:#e8f5e9;" title="Call" onclick="callNum('${phone}')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#2e7d32"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
          </button>
          <button class="icon-btn" style="background:#f3e5f5;" title="Copy name &amp; phone" onclick="copyContact('${name.replace(/'/g,"\\'")}','${phone}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="#7b1fa2"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
          <button class="icon-btn" style="background:#e8f8ef;" title="WhatsApp" onclick="waContact('${phone}','${name.replace(/'/g,"\\'")}')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#25d366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          </button>
          <button class="icon-btn" style="background:#f5f5f5;" title="Edit" onclick='openEdit(${JSON.stringify(r)})'>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="#555"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.21c.39-.39.39-1.02 0-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          </button>
          <button class="icon-btn" style="background:#ffebee;" title="Delete" onclick="deleteContact(${r.Id},'${name.replace(/'/g,"\\'")}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="#c62828"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </button>
        </div></td>
      </tr>`;
    }).join('');
    if (totalPages > 1) {
      let pg = '';
      if (currentPage > 1) pg += `<button onclick="loadContacts(${currentPage - 1})">← Prev</button>`;
      pg += `<span>Page ${currentPage} of ${totalPages}</span>`;
      if (currentPage < totalPages) pg += `<button onclick="loadContacts(${currentPage + 1})">Next →</button>`;
      pgDiv.innerHTML = pg;
    } else {
      pgDiv.innerHTML = '';
    }
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:#e53935;">Error: ' + escHtml(e.message) + '</td></tr>';
  }
}

function callNum(phone) {
  if (!phone) return showToast('No phone number');
  window.location.href = 'tel:' + phone;
}
function copyContact(name, phone) {
  navigator.clipboard.writeText(name + '\n' + phone)
    .then(() => showToast('Copied: ' + name))
    .catch(() => showToast(name + ' · ' + phone));
}
function waContact(phone, name) {
  if (!phone) return showToast('No phone number');
  let p = phone.replace(/[^\d+]/g, '');
  if (!p.startsWith('+') && p.length === 10) p = '91' + p;
  window.open('https://wa.me/' + p.replace('+', ''), '_blank');
}

function openEdit(contact) {
  document.getElementById('modal-title').textContent = contact ? 'Edit Contact' : 'Add Contact';
  document.getElementById('f-id').value = contact ? (contact.Id || '') : '';
  document.getElementById('f-name').value = contact ? (contact.Name || '') : '';
  document.getElementById('f-phone').value = contact ? (contact.Phone || '') : '';
  document.getElementById('f-place').value = contact ? (contact.Place || '') : '';
  document.getElementById('f-details').value = contact ? (contact.Details || '') : '';
  document.getElementById('f-date').value = contact ? (contact.Date || '') : new Date().toISOString().split('T')[0];
  document.getElementById('f-paid').value = contact ? (contact.AmountPaid || 'No') : 'No';
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

async function saveContact() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  if (!name) return showToast('Name is required');
  if (!phone) return showToast('Phone is required');
  const payload = {
    Name: name,
    Phone: phone,
    Place: document.getElementById('f-place').value.trim(),
    Details: document.getElementById('f-details').value.trim(),
    Date: document.getElementById('f-date').value,
    AmountPaid: document.getElementById('f-paid').value,
  };
  const idVal = document.getElementById('f-id').value;
  if (idVal) payload.Id = parseInt(idVal);
  try {
    await api('/api/renu-contacts', { method: 'POST', body: JSON.stringify(payload) });
    document.getElementById('modal').style.display = 'none';
    showToast('Saved');
    loadContacts(currentPage);
  } catch (e) {
    showToast('Error: ' + e.message);
  }
}

async function deleteContact(id, name) {
  if (!confirm('Delete contact "' + name + '"?')) return;
  try {
    await api('/api/renu-contacts/' + id, { method: 'DELETE' });
    showToast('Deleted');
    loadContacts(currentPage);
  } catch (e) {
    showToast('Error: ' + e.message);
  }
}

document.getElementById('search').addEventListener('input', () => loadContacts(1));
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') e.target.style.display = 'none';
});

loadContacts(1);
</script>

</body>
</html>
